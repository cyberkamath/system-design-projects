spring:
  application:
    name: analytics_service

  datasource:
    url: jdbc:postgresql://localhost:5433/analytics
    username: analytics
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "sh.kamath.analytics_service.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: sh.kamath.analytics_service.event.UrlClickedEvent

server:
  port: 8081

logging:
  level:
    sh.kamath.analytics_service: DEBUG